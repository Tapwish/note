name: Update Majestic RP Laws

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  parse-laws:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: 📦 Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-driver
          
      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: 🚀 Run parser
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: llama-3.3-70b-versatile
          FORUM_LOGIN: ${{ secrets.FORUM_LOGIN }}
          FORUM_PASSWORD: ${{ secrets.FORUM_PASSWORD }}
        run: python main.py
        
      - name: 📤 Commit and push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "🔄 Update laws $(date +'%Y-%m-%d %H:%M:%S')"
          git push
          
      - name: 📦 Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: laws-data
          path: data/
