name: Update Laws

on:
  schedule:
    - cron: '0 0 */3 * *'  # каждые 3 дня в 00:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run parser
        run: node parser.js

      - name: Commit and push changes
        run: |
          git config user.name "law-bot"
          git config user.email "law-bot@users.noreply.github.com"
          
          git pull --rebase origin main
          
          git add uk.json pk.json ak.json dk.json
          
          if git diff --staged --quiet; then
            echo "📭 Нет изменений"
          else
            git commit -m "chore: автообновление законов $(date '+%Y-%m-%d')"
            git push origin main
          fi
