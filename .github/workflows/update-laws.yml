name: Update Laws

on:
  schedule:
    - cron: '0 */6 * * *'  # каждые 6 часов
  workflow_dispatch:       # можно запустить вручную

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # забираем всю историю, включая теги

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install puppeteer

      - name: Run parser
        run: node parser.js

      - name: Commit and push changes
        run: |
          git config user.name "law-bot"
          git config user.email "law-bot@users.noreply.github.com"
          
          # Стягиваем последние изменения с удалённого репозитория
          git pull --rebase origin main
          
          # Добавляем изменения
          git add uk.json pk.json ak.json dk.json
          
          # Проверяем, есть ли изменения
          if git diff --staged --quiet; then
            echo "📭 Нет изменений для коммита"
          else
            git commit -m "chore: автообновление законов $(date '+%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ Законы обновлены"
          fi
