name: Update Laws

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Create parser.js in root
        run: |
          if [ -f scripts/parser.js ]; then
            cp scripts/parser.js parser.js
            echo "✅ Парсер скопирован в корень"
          elif [ -f parser.js ]; then
            echo "✅ Парсер уже в корне"
          else
            echo "❌ Парсер не найден!"
            exit 1
          fi

      - name: Run parser
        run: node parser.js

      - name: Commit and push changes
        run: |
          git config user.name "law-bot"
          git config user.email "law-bot@users.noreply.github.com"
          
          # === НОВЫЕ СТРОКИ ===
          git stash push --include-untracked -m "auto-stash before pull"
          git pull --rebase origin main
          git stash pop || true
          # === КОНЕЦ НОВЫХ СТРОК ===
          
          git add uk.json pk.json ak.json dk.json
          
          if git diff --staged --quiet; then
            echo "📭 Нет изменений"
          else
            git commit -m "chore: автообновление законов $(date '+%Y-%m-%d')"
            git push origin main
          fi
