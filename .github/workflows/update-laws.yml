name: Update Laws

on:
  schedule:
    - cron: '0 3 */3 * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-laws:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node scripts/scrape.js
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

      - name: Commit and push if changed
        run: |
          git config user.name "law-bot"
          git config user.email "law-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Изменений нет, коммит не нужен"
          else
            git commit -m "chore: автообновление законов $(date -u +%Y-%m-%d)"
            git push
          fi
