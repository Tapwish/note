name: Update Laws

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install puppeteer cheerio

      - name: Run parser
        run: node scripts/parser.js

      - name: Commit and push changes
        run: |
          git config user.name "law-bot"
          git config user.email "law-bot@users.noreply.github.com"
          
          git pull --rebase origin main
          
          git add orlando/*.json
          
          if git diff --staged --quiet; then
            echo "📭 Нет изменений для коммита"
          else
            git commit -m "chore: автообновление законов $(date '+%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ Законы обновлены"
          fi
